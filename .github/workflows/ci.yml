name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        run: pytest
      - name: Evaluation quality gate
        run: >-
          python evals/run_evals.py
          --min-hit-at-k 0.90
          --min-keyword-recall 0.55
          --min-abstention-accuracy 0.60
          --min-context-recall 0.90
      - name: Publish eval report
        if: always()
        run: cat evals/results/offline.md >> "$GITHUB_STEP_SUMMARY"

  observability:
    runs-on: ubuntu-latest
    env:
      PROMETHEUS_VERSION: "3.5.0"
    steps:
      - uses: actions/checkout@v4
      - name: Install promtool
        run: |
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            | tar xz --strip-components=1 -C /usr/local/bin "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
      - name: Check Prometheus config and alert rules
        run: promtool check config deploy/prometheus/prometheus.yml
      - name: Alert rule unit tests
        run: promtool test rules deploy/prometheus/alerts_test.yml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build image
        run: docker build -t production-rag-service .
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 -e LLM_PROVIDER=offline production-rag-service
          for i in $(seq 1 20); do curl -fs localhost:8000/healthz && break; sleep 1; done
          answer_id=$(curl -fs -X POST localhost:8000/v1/query \
            -H 'content-type: application/json' \
            -d '{"question": "When is the holiday change freeze?"}' \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["answer_id"])')
          # Feedback writes to disk as the non-root user: catches an unwritable data dir.
          curl -fs -X POST localhost:8000/v1/feedback \
            -H 'content-type: application/json' \
            -d "{\"answer_id\": \"$answer_id\", \"rating\": \"up\"}"
          curl -fs localhost:8000/metrics | grep -E '^rag_feedback_votes_total\{rating="up"\} 1.0$'
