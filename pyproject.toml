[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "production-rag-service"
version = "0.1.0"
description = "A production-minded RAG API: grounded answers with citations, evals in CI, caching, rate limiting and per-request cost tracking."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sriharsha T" }]
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.9",
  "fastapi>=0.115",
  "pydantic>=2.7",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
redis = ["redis>=5"]
ui = ["streamlit>=1.40", "requests>=2.32"]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.16,<0.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
