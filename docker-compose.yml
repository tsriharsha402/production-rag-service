services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      CACHE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  ui:
    build: .
    command: ["streamlit", "run", "ui/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api

  redis:
    image: redis:7-alpine
